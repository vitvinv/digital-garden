name: PlantGL CI Verification (Phase 0 — HARD GATE)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          environment-file: scripts/environment.yml
          activate-environment: digital-garden
          auto-activate-base: false

      - name: Run PlantGL verification (import, geometry, export)
        shell: bash -el {0}
        run: |
          python scripts/plantgl_verify.py

      - name: Install gltf-transform for validation
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate GLB with gltf-transform
        shell: bash -el {0}
        run: |
          npm install -g @gltf-transform/cli
          gltf-transform validate tmp/plantgl_test.glb
          echo "GLB size: $(stat -c%s tmp/plantgl_test.glb) bytes"

      - name: Upload GLB artifact
        uses: actions/upload-artifact@v4
        with:
          name: plantgl-test-glb
          path: tmp/plantgl_test.glb

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: plantgl-test-meta
          path: tmp/plantgl_test_meta.json
