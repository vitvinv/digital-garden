name: Daily Garden Growth

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-grow
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Install gltf-transform (Draco)
        run: npm install -g @gltf-transform/cli

      - name: Run plant regeneration
        run: python scripts/plant_glb.py

      - name: Publish and trigger deploy
        run: |
          git lfs install
          BEFORE=$(git rev-parse HEAD)
          bash scripts/publish.sh
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "Plant GLBs changed - dispatching deploy."
            gh workflow run "Deploy to GitHub Pages"
          else
            echo "No plant changes - skipping deploy."
          fi
