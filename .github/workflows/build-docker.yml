name: Build and Publish Docker Image

on:
  push:
    paths:
      - "Dockerfile"
      - "scripts/environment.yml"
      - "scripts/generate.py"
      - ".github/workflows/build-docker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-plantgl

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify PlantGL in image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            python -c "
          from openalea.plantgl.all import *
          scene = Scene()
          scene.add(Shape(Extrusion(Polyline([Vector3(0,0,0),Vector3(0,1,0)]), Polyline2D.Circle(0.3,8)), Material()))
          scene.add(Shape(Sphere(0.5), Material()))
          scene.apply(Discretizer())
          verts = sum(len(s.geometry.pointList) for s in scene if isinstance(s.geometry, TriangleSet))
          print('PlantGL OK:', verts, 'verts across', len(scene), 'shapes')
          "

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
