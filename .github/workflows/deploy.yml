name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build gardens
        run: |
          SITE=site
          rm -rf "$SITE" && mkdir -p "$SITE"
          jq -c '.gardens[]' gardens.json | while read -r garden; do
            DIR=$(echo "$garden" | jq -r .dir)
            SLUG=$(echo "$garden" | jq -r .slug)
            TITLE=$(echo "$garden" | jq -r '.title // .slug')
            WELCOME=$(echo "$garden" | jq -r '.welcome // false')
            echo "Building $SLUG from $DIR"
            (cd "$DIR" && npm ci && npm run build)
            mkdir -p "$SITE/$SLUG"
            cp -r "$DIR/dist/." "$SITE/$SLUG/"
            if [ "$WELCOME" = "true" ]; then
              mv "$SITE/$SLUG/index.html" "$SITE/$SLUG/app.html"
              sed -e "s/{{TITLE}}/$TITLE/g" -e "s/{{SLUG}}/$SLUG/g" \
                scripts/site/welcome.html > "$SITE/$SLUG/index.html"
            fi
          done
          cp scripts/site/root-index.html "$SITE/index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
